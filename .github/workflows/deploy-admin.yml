name: Deploy MegaVPN Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEGAVPN_ADMIN_TOKEN: ${{ secrets.MEGAVPN_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Embed admin panel safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          html = Path('admin/index.html').read_bytes()
          worker = Path('admin/worker.js')
          s = worker.read_text(encoding='utf-8')
          b64 = base64.b64encode(html).decode('ascii')
          embedded = 'const ADMIN_HTML = atob("' + b64 + '");'
          pattern = r'const ADMIN_HTML\s*=\s*.*?;(?=\s*function json\()'
          s, n = re.subn(pattern, embedded, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('ADMIN_HTML declaration not found')
          worker.write_text(s, encoding='utf-8')
          PY

      - name: Validate Worker syntax
        run: npx esbuild admin/worker.js --format=esm --outfile=/tmp/worker-check.js

      - name: Apply D1 schema
        run: wrangler d1 execute megavpn --remote --file=admin/schema.sql --config=admin/wrangler.toml --yes

      - name: Set admin token
        run: printf '%s' "$MEGAVPN_ADMIN_TOKEN" | wrangler secret put ADMIN_TOKEN --config=admin/wrangler.toml

      - name: Deploy Worker
        run: wrangler deploy --config=admin/wrangler.toml
