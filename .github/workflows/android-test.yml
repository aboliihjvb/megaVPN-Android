name: MegaVPN test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MegaVPN source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch open-source sing-box Android base
        run: |
          git clone --depth 1 https://github.com/AndrewYeah/pulse.git build/pulse
          mkdir -p build/pulse/app/libs
          curl -fL https://jitpack.io/com/github/singbox-android/libbox/1.13.14/libbox-1.13.14.aar \
            -o build/pulse/app/libs/libbox.aar

      - name: Install MegaVPN UI and subscription compatibility layer
        run: |
          cp src/MegaMainActivity.kt build/pulse/app/src/main/kotlin/com/andrew/proxyapp/MainActivity.kt
          cp src/MegaBuildConfig.kt build/pulse/app/src/main/kotlin/com/andrew/proxyapp/MegaBuildConfig.kt
          cp src/EmbeddedUriParser.kt build/pulse/app/src/main/kotlin/com/andrew/proxyapp/data/EmbeddedUriParser.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build/pulse/app/src/main/kotlin/com/andrew/proxyapp/data/SubscriptionManager.kt')
          s = p.read_text()
          marker = '''        val stableNodes = result.nodes.map { config ->\n'''
          injection = '''        // Compatibility fallback: some providers wrap VLESS/VMess/etc. URIs\n        // inside JSON, text, or another envelope. Keep the existing parsers first,\n        // then extract only recognized proxy URIs as a safe last resort.\n        if (result.nodes.isEmpty()) {\n            val fallback = EmbeddedUriParser.parse(normalizedContent, subscriptionId)\n            if (fallback.nodes.isNotEmpty()) result = fallback\n        }\n\n'''
          if injection.strip() not in s:
              if marker not in s:
                  raise SystemExit('SubscriptionManager patch marker not found')
              s = s.replace(marker, injection + marker, 1)
          p.write_text(s)
          PY
          grep -RIl --exclude-dir=.git 'Pulse' build/pulse/app/src/main 2>/dev/null | while read f; do
            sed -i 's/Pulse/MegaVPN/g' "$f"
          done

      - name: Build debug APK
        working-directory: build/pulse
        run: chmod +x gradlew && ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaVPN-one-button-apk
          path: build/pulse/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
